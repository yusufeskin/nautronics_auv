# Output stage: axis demand to ArduSub RC channels, for ALT_HOLD.
#
# This node converts the controller's demand into RC channel PWM and
# publishes it. It does not talk to the autopilot: pixhawk_bridge2 owns the
# MAVLink link and forwards what this publishes as RC_CHANNELS_OVERRIDE.
#
# Everything here describes ArduSub, not this stack. READ THE VALUES OFF THE
# VEHICLE'S PARAMETERS, then confirm the two rates by measurement: command a
# fixed throttle or yaw stick, read the climb or turn rate off the estimator.
#
# Also set on the vehicle, not here: RC_OVERRIDE_TIME. When this stack stops
# sending, that is how long ArduSub keeps the last override before returning
# the sticks to neutral. Keep it short - around a second.

pilot_demand:
  ros__parameters:

    send_rate_hz: 20.0

    # Longer than a couple of controller periods, short enough that a dead
    # controller cannot keep the vehicle driving into a wall. On timeout every
    # stick is centred, which in ALT_HOLD means hold depth, hold heading.
    command_timeout_s: 0.5

    # Output is gated off at startup and has to be turned on deliberately with
    # the ~/enable service. While disabled nothing is sent at all.
    start_enabled: false

    neutral_pwm: 1500
    span_pwm: 400               # full stick at 1100 / 1900

    # Rates at full stick. MEASURE / READ OFF THE VEHICLE.
    max_climb_rate_up: 0.5      # m/s, PILOT_SPEED_UP / 100
    max_climb_rate_down: 0.5    # m/s, PILOT_SPEED_DN / 100 (0 there means = UP)
    max_yaw_rate: 1.0           # rad/s - PLACEHOLDER, verify by measurement

    # ArduSub's stick deadzones, PWM either side of neutral. READ OFF THE VEHICLE.
    throttle_deadzone_pwm: 100  # THR_DZ
    yaw_deadzone_pwm: 0         # RC4_DZ
    forward_deadzone_pwm: 0     # RC5_DZ
    lateral_deadzone_pwm: 0     # RC6_DZ
