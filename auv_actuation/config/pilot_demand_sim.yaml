# Simulation overlay for the output stage.
#
# Loaded AFTER pilot_demand.yaml. SITL is ArduSub with its own default
# parameters, which need not match the vehicle's, so the values that describe
# ArduSub are restated here. Read them off SITL's parameters (param show
# PILOT_SPEED_UP and friends in the MAVProxy console) and confirm the rates
# the same way as on the vehicle.
#
# PLACEHOLDER values below - nobody has checked them against SITL yet.

pilot_demand:
  ros__parameters:
    max_climb_rate_up: 0.5
    max_climb_rate_down: 0.5
    max_yaw_rate: 1.0
    throttle_deadzone_pwm: 100
