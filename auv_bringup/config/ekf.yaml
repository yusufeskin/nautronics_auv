
ekf_filter_node:
  ros__parameters:

    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.3

    two_d_mode: false
    publish_tf: false
    print_diagnostics: true
    debug: false
    use_control: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # IMU
    imu0: /imu0/with_covariance

    imu0_config: [false, false, false,
                  true,  true,  false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]

    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false


    # DVL
    odom0: /waterlinked_dvl_driver/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_queue_size: 10
