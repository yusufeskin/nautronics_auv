# Jetson motion control:
#   /guidance/goal -> guidance -> /controller/reference -> position_controller
#   -> /axis_demand -> rc_output -> pwm_router -> pixhawk_bridge2 -> ArduSub
# Gains are first guesses, NOT tuned. Tune in sim, then in the pool.

guidance:
  ros__parameters:
    rate: 20.0
    world_frame: odom
    odom_topic: /odometry/filtered
    odom_timeout: 0.5
    controller_timeout: 1.0  # [s] no /controller/at_setpoint -> goals refused
    # Keep max_speed below position_controller.max_speed, or the controller's
    # speed cap clips the feedforward and the vehicle lags the reference.
    max_speed: 0.25          # [m/s] along the line
    max_accel: 0.1           # [m/s^2]
    max_vertical_speed: 0.15 # [m/s]
    max_yaw_rate_deg: 15.0   # [deg/s]

position_controller:
  ros__parameters:
    rate: 20.0
    odom_topic: /odometry/filtered
    dvl_topic: /waterlinked_dvl_driver/odom
    odom_timeout: 0.5        # [s] EKF older than this -> all sticks centred
    dvl_timeout: 1.0         # [s] DVL older than this -> surge/sway centred
    reference_timeout: 0.5   # [s] guidance feedforward older than this is dropped
    world_frame: odom

    # Horizontal cascade: position P -> speed demand -> velocity PI (m/s) on
    # DVL/EKF velocity -> inverse speed curve -> stick.
    pos_kp: 0.5              # [1/s]
    max_speed: 0.3           # [m/s]
    vel_kp: 1.0              # [-]   extra m/s commanded per m/s of velocity error
    vel_ki: 0.5              # [1/s]
    vel_i_limit: 0.3         # [m]   integrator limit; max correction = ki * limit [m/s]
    # Acceleration feedforward in stick units: the speed curve is steady-state
    # only, speeding up / braking needs extra push. Fitted on guidance_test_2/3
    # (excess stick vs measured accel): surge 0.088, sway 0.098.
    vel_ka: 0.09             # [stick per m/s^2]
    max_thrust: 0.4          # surge/sway output limit, [0, 1]  (~0.9 m/s in sim)

    # Yaw and depth: P only - ArduSub closes the rate loop on ch4 / ch3
    yaw_kp: 1.0              # demand per rad of yaw error
    max_yaw: 0.5
    yaw_deadband_deg: 1.0
    depth_kp: 1.0            # demand per m of depth error
    max_heave: 0.5
    depth_deadband: 0.03     # [m]

    # "At setpoint" thresholds (/controller/at_setpoint)
    pos_tolerance: 0.15      # [m]
    depth_tolerance: 0.10    # [m]
    yaw_tolerance_deg: 5.0

    # Steady speed [m/s] vs stick fraction in ALT_HOLD, from stick_calibration
    # (sim, 2026-11-28). Roughly v ~ sqrt(stick): drag grows with v^2.
    # 1 us = 0.0025 stick is already 0.047 m/s, so slow moves are coarse.
    # Must start at 0.0 and increase; write every value as a float (0.0, not 0).
    # Re-measure on the real vehicle and replace these.
    surge_curve_stick: [0.0, 0.0025, 0.005, 0.0075, 0.0125, 0.02, 0.03, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4]
    surge_curve_speed: [0.0, 0.048, 0.075, 0.098, 0.136, 0.181, 0.23, 0.308, 0.451, 0.562, 0.655, 0.813, 0.944]
    sway_curve_stick: [0.0, 0.0025, 0.005, 0.0075, 0.0125, 0.02, 0.03, 0.05, 0.1, 0.15, 0.2, 0.3, 0.4]
    sway_curve_speed: [0.0, 0.047, 0.077, 0.101, 0.139, 0.186, 0.237, 0.316, 0.465, 0.578, 0.674, 0.834, 0.97]

rc_output:
  ros__parameters:
    rate: 20.0
    demand_timeout: 0.5      # [s] stale demand -> neutral 1500
    pwm_range: 400           # 1500 +/- 400 at full demand
    pwm_min: 1100
    pwm_max: 1900
    # Flip a sign here if an axis moves the wrong way in the sign check.
    surge_sign: 1
    sway_sign: -1
    heave_sign: 1
    yaw_sign: -1
    start_enabled: false
    # ArduSub ALT_HOLD stick deadzones [us]; a non-zero demand starts just
    # outside them. Defaults with JS_GAIN 0.5: THR_DZ 100 -> 40 us,
    # RC4_DZ 40 -> 20 us. Recompute if THR_DZ, RC4_DZ or the gain change.
    surge_deadzone_us: 0
    sway_deadzone_us: 0
    heave_deadzone_us: 40
    yaw_deadzone_us: 20
