# ros_gz bridge for the new autonomy stack (auv_core / auv_sensors /
# auv_estimation / auv_actuation).
#
# Differs from bridge.yaml in exactly two ways, and both are there to stop the
# simulator fighting the estimator:
#
#   1. The Gazebo ground-truth TF is NOT bridged. Gazebo's OdometryPublisher
#      plugin publishes odom -> base_link, and so does robot_localization.
#      Two publishers on one transform is a fight nobody wins, and it presents
#      as TF jitter rather than as an obvious error.
#
#   2. Ground-truth odometry lands on /ground_truth/odom instead of /odom, so
#      it can be used for what it is genuinely good for - scoring the
#      estimator against the truth - without anything mistaking it for a real
#      measurement the vehicle could have made.
#
# bridge.yaml is untouched and still serves the legacy stack.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Truth, for offline comparison against /odom/filtered. Never an input to the
# estimator: nothing on the real vehicle produces it.
- ros_topic_name: "/ground_truth/odom"
  gz_topic_name: "/model/prototype_vehicle/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# The vio_imu from prototype.urdf.xacro, mounted with no rotation so it is
# already FLU-aligned. NOT /model/prototype_vehicle/imu, which is the flight
# IMU ArduPilot binds to and is mounted rolled by pi.
- ros_topic_name: "/imu0"
  gz_topic_name: "/imu0"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front/camera_info"
  gz_topic_name: "/camera/front/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/bottom/camera_info"
  gz_topic_name: "/camera/bottom/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/front"
  gz_topic_name: "/camera/front"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/bottom"
  gz_topic_name: "/camera/bottom"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/back"
  gz_topic_name: "/camera/back"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/sensors/sonar/front"
  gz_topic_name: "/sensors/sonar/front"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
